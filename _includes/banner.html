<header class="page-hero">
  <span class="blob ph-b1"></span><span class="blob ph-b2"></span>
  <svg class="leaf lf1" viewBox="0 0 40 44" fill="none"><path d="M20 2C7 11 7 31 20 42C33 31 33 11 20 2Z" fill="rgba(138,163,153,.5)"/><path d="M20 6v32" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/></svg>
  <svg class="leaf lf2" viewBox="0 0 40 44" fill="none"><path d="M20 2C7 11 7 31 20 42C33 31 33 11 20 2Z" fill="rgba(216,166,76,.4)"/><path d="M20 6v32" stroke="rgba(255,255,255,.3)" stroke-width="1.4"/></svg>
  <svg class="ink ink-1" viewBox="0 0 220 60" aria-hidden="true"><path d="M4 40 C40 12, 80 12, 116 34 S 188 54, 216 20" stroke-width="2.4" stroke-linecap="round"/></svg>
  <svg class="ink ink-2" viewBox="0 0 260 60" aria-hidden="true"><path d="M4 30 C50 54, 110 54, 150 28 S 230 6, 256 34" stroke-width="2.4" stroke-linecap="round"/></svg>
  <div class="wrap inner">
    <p class="eyebrow">{{ include.eyebrow }}</p>
    <h1>{{ include.title }}</h1>
    {% if include.meta %}<p class="post-meta">{{ include.meta }}</p>{% endif %}
    <svg class="penwrite" viewBox="0 0 200 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path id="ulpath" d="M10 20 C50 10, 90 26, 130 16 C160 9, 182 16, 192 15" stroke="#D8A64C" stroke-width="3" stroke-linecap="round" class="uline"/>
      <g class="pennib">
        <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto" keyTimes="0;0.5;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#ulpath"/></animateMotion>
        <animate attributeName="opacity" dur="5.5s" repeatCount="indefinite" values="0;1;1;1;0;0" keyTimes="0;0.05;0.5;0.84;0.94;1"/>
        <path d="M0 0 L6 -2 L2 -7 Z" fill="#F5F1E9"/>
        <path d="M3 -5 L-7 -26" stroke="#D8A64C" stroke-width="4.2" stroke-linecap="round"/>
        <path d="M-7 -26 L-11 -31" stroke="#5E7A6A" stroke-width="4.2" stroke-linecap="round"/>
      </g>
    </svg>
    {% if include.sub %}<p>{{ include.sub }}</p>{% endif %}
  </div>
</header>

<svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="margin-top:-1px;">
  <path fill="#2C4A38" d="M0,0 L1440,0 L1440,26 C1080,74 720,74 360,44 C240,34 120,36 0,50 Z"></path>
  <path fill="#F5F1E9" d="M0,50 C120,36 240,34 360,44 C720,74 1080,74 1440,26 L1440,80 L0,80 Z"></path>
</svg>
