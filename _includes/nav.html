<nav id="nav">
  <div class="wrap">
    <a href="{{ '/' | relative_url }}" class="brand"><img src="{{ '/logo.png' | relative_url }}" alt="{{ site.author.name }} logo" class="brand-logo"><span>{{ site.author.name }}</span></a>
    <div class="navlinks">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if item.url == page.url or (page.layout == 'post' and item.url == '/blog/') %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </div>
  </div>
</nav>
