# Netlify derleme ayarları.
# Site Jekyll ile üretilir; çıktı _site klasörüne yazılır.

[build]
  publish = "_site"
  command = "bundle exec jekyll build"

[build.environment]
  JEKYLL_ENV = "production"

# /blog adresi doğrudan blog sayfasını göstersin.
#
# Neden gerekli: derleme çıktısında hem blog/index.html (gerçek sayfa) hem de
# blog.html (r-blog.html'den gelen eski adres yönlendirmesi) var. Netlify
# sondaki eğik çizgiyi kırptığı için /blog/ adresi /blog'a düşüyor ve orada
# blog.html seçiliyordu; o da /blog/ adresine yönlendirdiği için sonsuz
# döngü oluşuyordu.
#
# status = 200 -> yönlendirme değil, doğrudan o dosyayı sunar (adres değişmez)
# force = true -> aynı yolda dosya bulunsa bile bu kural öncelikli olur
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200
  force = true
