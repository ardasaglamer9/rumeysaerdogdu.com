# ---- Jekyll ayarları ----
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:title.html
timezone: Europe/Istanbul

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - KURULUM.md
  - CLAUDE.md
  - vendor
  - netlify.toml
  # Kök dizindeki bu ikisi, _includes içindekilerin eski kopyalarıdır ve
  # hiçbir yerden çağrılmaz. Yayınlanırlarsa tek başına açıldığında bozuk
  # görünen sayfalar oluşuyordu.
  - banner.html
  - threads.html
